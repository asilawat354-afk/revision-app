name: Build APK from HTML

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor Android project
        run: |
          mkdir www
          cp index.html www/index.html
          if [ -f google-services.json ]; then
            PID=$(python3 -c "import json;print(json.load(open('google-services.json'))['project_info']['project_id'])")
            sed -i "s/YOUR_FIREBASE_PROJECT_ID/$PID/" www/index.html
          fi
          cat > capacitor.config.json << 'CFG'
          {
            "appId": "com.revision.universe",
            "appName": "Revision Universe",
            "webDir": "www",
            "android": { "adjustMarginsForEdgeToEdge": "disable" },
            "plugins": {
              "SystemBars": { "insetsHandling": "disable" },
              "CapacitorHttp": { "enabled": true },
              "FirebaseAuthentication": {
                "skipNativeAuth": false,
                "providers": ["google.com"]
              }
            }
          }
          CFG
          npm init -y
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share @capacitor/app @capacitor-firebase/authentication firebase
          npx cap add android
          printf '\next {\n    rgcfaIncludeGoogle = true\n}\n' >> android/variables.gradle
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; fi
          npx cap sync android

      - name: Match system bars with app colors
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -1)
          PKG=$(grep -m1 '^package ' "$MAIN" | sed 's/package //; s/;//')
          echo "MainActivity: $MAIN  package: $PKG"
          cat > "$MAIN" << JAVA
          package $PKG;

          import android.app.Activity;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.ColorFilter;
          import android.graphics.Paint;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.Drawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.widget.Toast;
          import androidx.annotation.NonNull;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          public class MainActivity extends BridgeActivity {

            static class BarsBg extends Drawable {
              int top = Color.BLACK, bottom = Color.BLACK, topH = 0, botH = 0;
              final Paint p = new Paint();
              @Override public void draw(@NonNull Canvas c) {
                int w = getBounds().width(), h = getBounds().height();
                p.setColor(top);    c.drawRect(0, 0, w, h, p);
                p.setColor(bottom); c.drawRect(0, h - botH, w, h, p);
              }
              @Override public void setAlpha(int a) {}
              @Override public void setColorFilter(ColorFilter f) {}
              @Override public int getOpacity() { return PixelFormat.OPAQUE; }
            }

            static final BarsBg bg = new BarsBg();

            @CapacitorPlugin(name = "AppBars")
            public static class AppBarsPlugin extends Plugin {
              @PluginMethod
              public void setBars(final PluginCall call) {
                final String t = call.getString("top");
                final String b = call.getString("bottom");
                final Activity act = getActivity();
                act.runOnUiThread(() -> {
                  try {
                    int tc = Color.parseColor(t), bc = Color.parseColor(b);
                    bg.top = tc; bg.bottom = bc;
                    Window w = act.getWindow();
                    w.getDecorView().invalidate();
                    WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, w.getDecorView());
                    c.setAppearanceLightStatusBars(isLight(tc));
                    c.setAppearanceLightNavigationBars(isLight(bc));
                  } catch (Throwable ignored) {}
                });
                call.resolve();
              }
            }

            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(AppBarsPlugin.class);
              super.onCreate(savedInstanceState);
              final Window w = getWindow();
              WindowCompat.setDecorFitsSystemWindows(w, false);
              w.setBackgroundDrawable(bg);
              try {
                w.setStatusBarColor(Color.TRANSPARENT);
                w.setNavigationBarColor(Color.TRANSPARENT);
                if (Build.VERSION.SDK_INT >= 29) {
                  w.setNavigationBarContrastEnforced(false);
                  w.setStatusBarContrastEnforced(false);
                }
              } catch (Throwable ignored) {}

              final View content = findViewById(android.R.id.content);
              ViewCompat.setOnApplyWindowInsetsListener(content, (v, insets) -> {
                Insets bars = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                Insets ime = insets.getInsets(WindowInsetsCompat.Type.ime());
                v.setPadding(bars.left, bars.top, bars.right, Math.max(bars.bottom, ime.bottom));
                bg.topH = bars.top;
                bg.botH = Math.max(bars.bottom, ime.bottom);
                w.getDecorView().invalidate();
                return WindowInsetsCompat.CONSUMED;
              });
              ViewCompat.requestApplyInsets(content);
              Toast.makeText(this, "Bars v2 active", Toast.LENGTH_SHORT).show();
            }

            static boolean isLight(int c) {
              double l = (0.299 * Color.red(c) + 0.587 * Color.green(c) + 0.114 * Color.blue(c)) / 255.0;
              return l > 0.6;
            }
          }
          JAVA
          head -20 "$MAIN"

      - name: Use fixed debug keystore
        run: |
          test -f debug.keystore || { echo "ERROR: debug.keystore repo me nahi mili"; exit 1; }
          keytool -list -v -keystore debug.keystore -storepass android | grep -E "Alias|SHA1"
          cp debug.keystore android/app/debug.keystore
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          sed -i '0,/^android {/s//android {\n    signingConfigs {\n        debug {\n            storeFile file("debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }/' android/app/build.gradle
          grep -n -A8 "signingConfigs" android/app/build.gradle | head -12

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Show APK signing SHA-1
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-1" || true

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
