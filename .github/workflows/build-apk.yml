name: Build APK from HTML

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor Android project
        run: |
          mkdir www
          cp index.html www/index.html
          if [ -f google-services.json ]; then
            PID=$(python3 -c "import json;print(json.load(open('google-services.json'))['project_info']['project_id'])")
            sed -i "s/YOUR_FIREBASE_PROJECT_ID/$PID/" www/index.html
          fi
          cat > capacitor.config.json << 'CFG'
          {
            "appId": "com.revision.universe",
            "appName": "Revision Universe",
            "webDir": "www",
            "android": { "adjustMarginsForEdgeToEdge": "disable" },
            "plugins": {
              "SystemBars": { "insetsHandling": "disable" },
              "CapacitorHttp": { "enabled": true },
              "FirebaseAuthentication": {
                "skipNativeAuth": false,
                "providers": ["google.com"]
              }
            }
          }
          CFG
          npm init -y
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share @capacitor/app @capacitor-firebase/authentication firebase
          npx cap add android
          printf '\next {\n    rgcfaIncludeGoogle = true\n}\n' >> android/variables.gradle
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; fi
          npx cap sync android

      - name: Edge-to-edge system bars (transparent status + navigation bar)
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -1)
          PKG=$(grep -m1 '^package ' "$MAIN" | sed 's/package //; s/;//')
          echo "MainActivity: $MAIN  package: $PKG"
          cat > "$MAIN" << 'JAVA'
          package __PKG__;

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

            private static final int DARK_BG = 0xFF030712;
            private static final int LIGHT_BG = 0xFFF8FAFC;

            private final Handler handler = new Handler(Looper.getMainLooper());
            private volatile int insTop = 0, insBottom = 0, insLeft = 0, insRight = 0;
            private boolean dark = true;
            private boolean bridgeAdded = false;

            private final Runnable pushNow = new Runnable() {
              @Override public void run() { pushInsets(); }
            };

            /** Web page isse status bar / navigation bar ki size (dp) padhta hai aur icon colour set karta hai. */
            public class InsetsBridge {
              @JavascriptInterface
              public String get() {
                return insTop + "," + insBottom + "," + insLeft + "," + insRight;
              }

              @JavascriptInterface
              public void setDark(final boolean isDark) {
                runOnUiThread(new Runnable() {
                  @Override public void run() { applyAppearance(isDark); }
                });
              }
            }

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              try {
                setupEdgeToEdge();
              } catch (Throwable ignored) {
              }
            }

            @Override
            public void onResume() {
              super.onResume();
              try {
                attachBridge();
                applyAppearance(dark);
                View content = findViewById(android.R.id.content);
                if (content != null) ViewCompat.requestApplyInsets(content);
                handler.postDelayed(pushNow, 400);
                handler.postDelayed(pushNow, 1500);
                handler.postDelayed(pushNow, 3500);
              } catch (Throwable ignored) {
              }
            }

            @Override
            public void onPause() {
              super.onPause();
              handler.removeCallbacks(pushNow);
            }

            private void setupEdgeToEdge() {
              final Window w = getWindow();
              WindowCompat.setDecorFitsSystemWindows(w, false);
              w.setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);
              w.setStatusBarColor(Color.TRANSPARENT);
              w.setNavigationBarColor(Color.TRANSPARENT);
              if (Build.VERSION.SDK_INT >= 29) {
                w.setNavigationBarContrastEnforced(false);
                w.setStatusBarContrastEnforced(false);
              }
              if (Build.VERSION.SDK_INT >= 28) {
                WindowManager.LayoutParams lp = w.getAttributes();
                lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                w.setAttributes(lp);
              }
              applyAppearance(true);

              final View content = findViewById(android.R.id.content);
              if (content == null) return;
              ViewCompat.setOnApplyWindowInsetsListener(content, (v, insets) -> {
                try {
                  Insets bars = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                  Insets ime = insets.getInsets(WindowInsetsCompat.Type.ime());
                  boolean imeOn = insets.isVisible(WindowInsetsCompat.Type.ime()) && ime.bottom > 0;
                  // Keyboard khula ho to webview ko keyboard ke upar tak chhota kar do
                  v.setPadding(0, 0, 0, imeOn ? ime.bottom : 0);
                  float d = getResources().getDisplayMetrics().density;
                  if (d <= 0f) d = 1f;
                  insTop = Math.round(bars.top / d);
                  insBottom = imeOn ? 0 : Math.round(bars.bottom / d);
                  insLeft = Math.round(bars.left / d);
                  insRight = Math.round(bars.right / d);
                  pushInsets();
                } catch (Throwable ignored) {
                }
                return insets;
              });
              ViewCompat.requestApplyInsets(content);
              attachBridge();
            }

            private void attachBridge() {
              if (bridgeAdded) return;
              try {
                WebView wv = getBridge() != null ? getBridge().getWebView() : null;
                if (wv == null) return;
                wv.addJavascriptInterface(new InsetsBridge(), "AndroidInsets");
                bridgeAdded = true;
              } catch (Throwable ignored) {
              }
            }

            private void pushInsets() {
              try {
                WebView wv = getBridge() != null ? getBridge().getWebView() : null;
                if (wv == null) return;
                wv.evaluateJavascript("window.__setInsets&&window.__setInsets("
                    + insTop + "," + insBottom + "," + insLeft + "," + insRight + ")", null);
              } catch (Throwable ignored) {
              }
            }

            private void applyAppearance(boolean isDark) {
              dark = isDark;
              try {
                Window w = getWindow();
                int bg = isDark ? DARK_BG : LIGHT_BG;
                w.getDecorView().setBackgroundColor(bg);
                WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, w.getDecorView());
                // true = dark icons (light theme), false = light icons (dark theme)
                c.setAppearanceLightStatusBars(!isDark);
                c.setAppearanceLightNavigationBars(!isDark);
              } catch (Throwable ignored) {
              }
            }
          }
          JAVA
          sed -i "s/__PKG__/$PKG/" "$MAIN"
          head -5 "$MAIN"

      - name: Use fixed debug keystore
        run: |
          test -f debug.keystore || { echo "ERROR: debug.keystore repo me nahi mili"; exit 1; }
          keytool -list -v -keystore debug.keystore -storepass android | grep -E "Alias|SHA1"
          cp debug.keystore android/app/debug.keystore
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          sed -i '0,/^android {/s//android {\n    signingConfigs {\n        debug {\n            storeFile file("debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }/' android/app/build.gradle
          grep -n -A8 "signingConfigs" android/app/build.gradle | head -12

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          PROPS=gradle/wrapper/gradle-wrapper.properties
          cat "$PROPS"
          VER=$(sed -nE 's/.*gradle-([0-9][0-9.]*)-(all|bin)\.zip.*/\1/p' "$PROPS" | head -1)
          KIND=$(sed -nE 's/.*gradle-[0-9][0-9.]*-(all|bin)\.zip.*/\1/p' "$PROPS" | head -1)
          echo "Gradle $VER ($KIND)"
          ok=0
          for i in 1 2 3 4; do
            if ./gradlew assembleDebug; then ok=1; break; fi
            echo "Build attempt $i failed"
            M=""
            if [ "$i" = "1" ]; then M="https://mirrors.cloud.tencent.com/gradle"; fi
            if [ "$i" = "2" ]; then M="https://repo.huaweicloud.com/gradle"; fi
            if [ -n "$M" ] && [ -n "$VER" ] && [ -n "$KIND" ]; then
              echo "Switching Gradle download to mirror: $M"
              sed -i "s#^distributionUrl=.*#distributionUrl=$M/gradle-$VER-$KIND.zip#" "$PROPS"
              grep distributionUrl "$PROPS"
            fi
            sleep 15
          done
          test "$ok" = 1

      - name: Show APK signing SHA-1
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-1" || true

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
