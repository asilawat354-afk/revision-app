name: Build APK from HTML

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor Android project
        run: |
          mkdir www
          cp index.html www/index.html
          if [ -f google-services.json ]; then
            PID=$(python3 -c "import json;print(json.load(open('google-services.json'))['project_info']['project_id'])")
            sed -i "s/YOUR_FIREBASE_PROJECT_ID/$PID/" www/index.html
          fi
          cat > capacitor.config.json << 'CFG'
          {
            "appId": "com.revision.universe",
            "appName": "Revision Universe",
            "webDir": "www",
            "plugins": {
              "CapacitorHttp": { "enabled": true },
              "FirebaseAuthentication": {
                "skipNativeAuth": false,
                "providers": ["google.com"]
              }
            }
          }
          CFG
          npm init -y
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share @capacitor-firebase/authentication firebase
          npx cap add android
          printf '\next {\n    rgcfaIncludeGoogle = true\n}\n' >> android/variables.gradle
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; fi
          npx cap sync android

      - name: Use fixed debug keystore
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Show APK signing SHA-1
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-1" || true
          keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i "SHA1" || true

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
