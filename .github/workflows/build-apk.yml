name: Build APK from HTML

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor Android project
        run: |
          mkdir www
          cp index.html www/index.html
          if [ -f google-services.json ]; then
            PID=$(python3 -c "import json;print(json.load(open('google-services.json'))['project_info']['project_id'])")
            sed -i "s/YOUR_FIREBASE_PROJECT_ID/$PID/" www/index.html
          fi
          cat > capacitor.config.json << 'CFG'
          {
            "appId": "com.revision.universe",
            "appName": "Revision Universe",
            "webDir": "www",
            "android": { "adjustMarginsForEdgeToEdge": "disable" },
            "plugins": {
              "SystemBars": { "insetsHandling": "disable" },
              "CapacitorHttp": { "enabled": true },
              "FirebaseAuthentication": {
                "skipNativeAuth": false,
                "providers": ["google.com"]
              }
            }
          }
          CFG
          npm init -y
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share @capacitor/app @capacitor-firebase/authentication firebase
          npx cap add android
          printf '\next {\n    rgcfaIncludeGoogle = true\n}\n' >> android/variables.gradle
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; fi
          npx cap sync android

      - name: Match system bars with app colors
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -1)
          PKG=$(grep -m1 '^package ' "$MAIN" | sed 's/package //; s/;//')
          echo "MainActivity: $MAIN  package: $PKG"
          cat > "$MAIN" << JAVA
          package $PKG;

          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.Rect;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.PixelCopy;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import android.widget.Toast;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

            private final Handler handler = new Handler(Looper.getMainLooper());
            private int candTop = 0, candBot = 0, stable = 0;
            private int curTop = 0, curBot = 0;
            private boolean applied = false, toasted = false;
            private int gotTop, gotBot, got = 0;

            private final Runnable tick = new Runnable() {
              @Override public void run() {
                try { sample(); } catch (Throwable ignored) {}
                handler.postDelayed(this, 350);
              }
            };

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              try { getBridge().getWebView().setOverScrollMode(View.OVER_SCROLL_NEVER); } catch (Throwable ignored) {}
            }

            @Override
            public void onResume() {
              super.onResume();
              handler.postDelayed(tick, 700);
            }

            @Override
            public void onPause() {
              super.onPause();
              handler.removeCallbacks(tick);
            }

            private void sample() {
              if (Build.VERSION.SDK_INT < 26) return;
              final WebView wv = getBridge().getWebView();
              if (wv == null || wv.getWidth() == 0 || wv.getHeight() == 0) return;
              int[] loc = new int[2];
              wv.getLocationInWindow(loc);
              final Window w = getWindow();
              int x = loc[0] + 6;
              int yTop = loc[1] + 2;
              int yBot = loc[1] + wv.getHeight() - 3;
              got = 0;
              grab(w, x, yTop, true);
              grab(w, x, yBot, false);
            }

            private void grab(Window w, int x, int y, final boolean isTop) {
              final Bitmap bm = Bitmap.createBitmap(1, 1, Bitmap.Config.ARGB_8888);
              PixelCopy.request(w, new Rect(x, y, x + 1, y + 1), bm, copyResult -> {
                if (copyResult != PixelCopy.SUCCESS) return;
                int c = bm.getPixel(0, 0) | 0xFF000000;
                if (isTop) gotTop = c; else gotBot = c;
                if (++got == 2) onColors(gotTop, gotBot);
              }, handler);
            }

            private static boolean close(int a, int b, int d) {
              return Math.abs(Color.red(a) - Color.red(b)) <= d
                  && Math.abs(Color.green(a) - Color.green(b)) <= d
                  && Math.abs(Color.blue(a) - Color.blue(b)) <= d;
            }

            private void onColors(int t, int b) {
              if (!close(t, candTop, 3) || !close(b, candBot, 3)) {
                candTop = t; candBot = b; stable = 1;
                return;
              }
              if (++stable < 2) return;
              if (applied && close(t, curTop, 6) && close(b, curBot, 6)) return;
              curTop = t; curBot = b; applied = true;
              applyBars(t, b);
            }

            private void applyBars(int tc, int bc) {
              String err = "ok";
              try {
                Window w = getWindow();
                w.clearFlags(WindowManager.LayoutParams.FLAG_TRANSLUCENT_STATUS | WindowManager.LayoutParams.FLAG_TRANSLUCENT_NAVIGATION);
                w.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                w.setStatusBarColor(tc);
                w.setNavigationBarColor(bc);
                if (Build.VERSION.SDK_INT >= 29) {
                  w.setNavigationBarContrastEnforced(false);
                  w.setStatusBarContrastEnforced(false);
                }
                WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, w.getDecorView());
                c.setAppearanceLightStatusBars(isLight(tc));
                c.setAppearanceLightNavigationBars(isLight(bc));
                if (!toasted) {
                  toasted = true;
                  Toast.makeText(this, "v5 sdk" + Build.VERSION.SDK_INT
                    + " set top=" + String.format("#%06X", tc & 0xFFFFFF)
                    + " bot=" + String.format("#%06X", bc & 0xFFFFFF)
                    + " readTop=" + String.format("#%06X", w.getStatusBarColor() & 0xFFFFFF), Toast.LENGTH_LONG).show();
                }
              } catch (Throwable e) {
                Toast.makeText(this, "err " + e, Toast.LENGTH_LONG).show();
              }
            }

            static boolean isLight(int c) {
              double l = (0.299 * Color.red(c) + 0.587 * Color.green(c) + 0.114 * Color.blue(c)) / 255.0;
              return l > 0.6;
            }
          }
          JAVA
          head -20 "$MAIN"

      - name: Use fixed debug keystore
        run: |
          test -f debug.keystore || { echo "ERROR: debug.keystore repo me nahi mili"; exit 1; }
          keytool -list -v -keystore debug.keystore -storepass android | grep -E "Alias|SHA1"
          cp debug.keystore android/app/debug.keystore
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          sed -i '0,/^android {/s//android {\n    signingConfigs {\n        debug {\n            storeFile file("debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }/' android/app/build.gradle
          grep -n -A8 "signingConfigs" android/app/build.gradle | head -12

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Show APK signing SHA-1
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-1" || true

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
