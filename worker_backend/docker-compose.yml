version: '3.8'

services:
  build-worker:
    build: .
    container_name: web2apk-worker
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - BUILDS_DIR=/app/builds
    volumes:
      - ./builds:/app/builds
      - android-cache:/root/.gradle
    restart: unless-stopped

volumes:
  android-cache:
